name: Deploy to Amazon EC2 + S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ── Job 1: Deploy Backend to EC2 ──────────────────────────────
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e

            echo "──────────────────────────────────────────"
            echo "🔍 Checking system dependencies..."
            echo "──────────────────────────────────────────"

            if ! command -v node &> /dev/null; then
              echo "📦 Installing Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            echo "✅ Node: $(node -v)  NPM: $(npm -v)"

            if ! command -v pm2 &> /dev/null; then
              echo "📦 Installing PM2..."
              sudo npm install -g pm2
            fi
            echo "✅ PM2: $(pm2 -v)"

            echo ""
            echo "──────────────────────────────────────────"
            echo "📥 Pulling latest code..."
            echo "──────────────────────────────────────────"

            if [ ! -d "/home/ubuntu/Nb" ]; then
              git clone https://github.com/DineshMadhavanM/Nb.git /home/ubuntu/Nb
            fi

            cd /home/ubuntu/Nb
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            echo ""
            echo "──────────────────────────────────────────"
            echo "🔧 Setting up Backend..."
            echo "──────────────────────────────────────────"

            cd backend

            printf 'DATABASE_URL="%s"\nPORT=5000\n' '${{ secrets.DATABASE_URL }}' > .env
            echo "✅ backend/.env written"

            npm install --production
            echo "✅ npm install done"

            npx prisma generate
            echo "✅ prisma generate done"

            npx prisma db push --accept-data-loss
            echo "✅ prisma db push done"

            if pm2 describe backend > /dev/null 2>&1; then
              pm2 restart backend
            else
              pm2 start index.js --name "backend"
            fi
            pm2 save
            echo "✅ Backend PM2 process running"

            # Health check — retry up to 30 seconds
            echo "⏳ Waiting for backend to come up..."
            for i in $(seq 1 6); do
              sleep 5
              if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
                echo "✅ Backend is running on port 5000"
                break
              fi
              echo "  attempt $i/6 — not ready yet..."
              if [ $i -eq 6 ]; then
                echo "❌ Backend failed to start! Last logs:"
                pm2 logs backend --lines 50 --nostream || true
                exit 1
              fi
            done

            echo "🚀 Backend deployment complete!"

  # ── Job 2: Build Frontend & Deploy to S3 ──────────────────────
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "VITE_API_URL=$VITE_API_URL" > .env
          echo "✅ .env written: VITE_API_URL=$VITE_API_URL"
          npm ci
          npm run build
          echo "✅ Frontend build complete"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync dist to S3
        run: |
          aws s3 sync frontend/dist s3://1906-b --delete
          echo "✅ Synced frontend/dist to s3://1906-b"

      - name: Invalidate CloudFront Cache
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
          echo "✅ CloudFront cache invalidated"
