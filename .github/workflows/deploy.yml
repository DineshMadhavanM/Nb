name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            echo "──────────────────────────────────────────"
            echo "🔍 Checking system dependencies..."
            echo "──────────────────────────────────────────"

            # Install Node.js 20 if not present
            if ! command -v node &> /dev/null; then
              echo "📦 Installing Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            echo "✅ Node: $(node -v)  NPM: $(npm -v)"

            # Install PM2 globally if not present
            if ! command -v pm2 &> /dev/null; then
              echo "📦 Installing PM2..."
              sudo npm install -g pm2
            fi
            echo "✅ PM2: $(pm2 -v)"

            # Install serve globally if not present
            if ! command -v serve &> /dev/null; then
              echo "📦 Installing serve..."
              sudo npm install -g serve
            fi

            echo ""
            echo "──────────────────────────────────────────"
            echo "📥 Pulling latest code..."
            echo "──────────────────────────────────────────"

            if [ ! -d "/home/ubuntu/Nb" ]; then
              git clone https://github.com/DineshMadhavanM/Nb.git /home/ubuntu/Nb
            fi

            cd /home/ubuntu/Nb
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            echo ""
            echo "──────────────────────────────────────────"
            echo "🔧 Setting up Backend..."
            echo "──────────────────────────────────────────"

            cd backend

            # Write backend .env from GitHub Secrets (injected directly by GitHub Actions)
            printf 'DATABASE_URL="%s"\nPORT=5000\n' '${{ secrets.DATABASE_URL }}' > .env
            echo "✅ backend/.env written"

            npm install --production
            echo "✅ npm install done"

            npx prisma generate
            echo "✅ prisma generate done"

            npx prisma db push --accept-data-loss
            echo "✅ prisma db push done"

            # Start / restart backend with PM2
            if pm2 describe backend > /dev/null 2>&1; then
              pm2 restart backend
              echo "✅ PM2 restarted backend"
            else
              pm2 start index.js --name "backend"
              echo "✅ PM2 started backend"
            fi
            pm2 save

            # Health check — wait up to 30 seconds
            echo "⏳ Waiting for backend to come up..."
            for i in $(seq 1 6); do
              sleep 5
              if curl -sf http://localhost:5000/ > /dev/null 2>&1; then
                echo "✅ Backend is running on port 5000"
                break
              fi
              echo "  attempt $i/6 — not ready yet..."
              if [ $i -eq 6 ]; then
                echo "❌ Backend failed to start after 30s! Last logs:"
                pm2 logs backend --lines 50 --nostream || true
                exit 1
              fi
            done

            echo ""
            echo "──────────────────────────────────────────"
            echo "🎨 Setting up Frontend..."
            echo "──────────────────────────────────────────"

            cd ../frontend

            # Write frontend .env from GitHub Secrets (injected directly by GitHub Actions)
            echo 'VITE_API_URL=${{ secrets.VITE_API_URL }}' > .env
            echo "✅ frontend/.env written: VITE_API_URL=${VITE_API_URL}"

            npm install
            echo "✅ npm install done"

            npm run build
            echo "✅ build done"

            # Start / restart frontend with PM2 (use absolute path so PM2 always finds dist)
            pm2 delete frontend > /dev/null 2>&1 || true
            pm2 start "serve -s /home/ubuntu/Nb/frontend/dist -l 3000" --name "frontend"
            echo "✅ PM2 started frontend"
            pm2 save

            echo ""
            echo "══════════════════════════════════════════"
            echo "🚀 Deployment complete!"
            echo "   Frontend : http://${EC2_HOST}:3000"
            echo "   Backend  : http://${EC2_HOST}:5000"
            echo "══════════════════════════════════════════"
            pm2 status
