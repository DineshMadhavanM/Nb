name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            echo "──────────────────────────────────────────"
            echo "🔍 Checking system dependencies..."
            echo "──────────────────────────────────────────"

            if ! command -v node &> /dev/null; then
              echo "📦 Installing Node.js..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            echo "✅ Node: $(node -v)  NPM: $(npm -v)"

            if ! command -v pm2 &> /dev/null; then
              echo "📦 Installing PM2..."
              sudo npm install -g pm2
            fi
            echo "✅ PM2: $(pm2 -v)"

            if ! command -v serve &> /dev/null; then
              echo "📦 Installing serve..."
              sudo npm install -g serve
            fi
            echo "✅ serve installed"

            echo ""
            echo "──────────────────────────────────────────"
            echo "📥 Pulling latest code..."
            echo "──────────────────────────────────────────"

            if [ ! -d "/home/ubuntu/Nb" ]; then
              git clone https://github.com/DineshMadhavanM/Nb.git /home/ubuntu/Nb
            fi

            cd /home/ubuntu/Nb
            git fetch origin
            git reset --hard origin/main
            git pull origin main

            echo ""
            echo "──────────────────────────────────────────"
            echo "🔧 Setting up Backend..."
            echo "──────────────────────────────────────────"

            cd /home/ubuntu/Nb/backend

            printf 'DATABASE_URL="%s"\nPORT=5000\n' '${{ secrets.DATABASE_URL }}' > .env
            echo "✅ backend/.env written"

            npm install --production
            npx prisma generate
            npx prisma db push --accept-data-loss
            echo "✅ Prisma ready"

            if pm2 describe backend > /dev/null 2>&1; then
              pm2 restart backend
            else
              pm2 start index.js --name "backend"
            fi
            pm2 save
            echo "✅ Backend running"

            echo ""
            echo "──────────────────────────────────────────"
            echo "🎨 Building Frontend..."
            echo "──────────────────────────────────────────"

            cd /home/ubuntu/Nb/frontend

            echo 'VITE_API_URL=${{ secrets.VITE_API_URL }}' > .env
            echo "✅ frontend/.env written"

            npm install
            npm run build
            echo "✅ Frontend built"

            # Always delete + start fresh so the correct path is used
            pm2 delete frontend > /dev/null 2>&1 || true
            pm2 start "serve -s /home/ubuntu/Nb/frontend/dist -l 3000" --name "frontend"
            pm2 save
            echo "✅ Frontend served at port 3000"

            echo ""
            echo "══════════════════════════════════════════"
            echo "🚀 Deployment complete!"
            echo "   Frontend : http://${{ secrets.EC2_HOST }}:3000"
            echo "   Backend  : http://${{ secrets.EC2_HOST }}:5000"
            echo "══════════════════════════════════════════"
            pm2 status
